[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/var/run/supervisord.pid

; Apache reste au premier plan : c'est le processus dont Render surveille la
; santé (port $PORT). S'il meurt, supervisord — et donc le conteneur — meurt
; avec lui plutôt que de tourner "à moitié vivant".
[program:apache2]
command=/usr/sbin/apache2ctl -D FOREGROUND
autostart=true
autorestart=true
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; cron ne sert qu'à réveiller `schedule:run` chaque minute (cf. laravel-cron) ;
; sa perte n'a pas besoin d'entraîner l'arrêt du conteneur.
[program:cron]
command=/usr/sbin/cron -f
autostart=true
autorestart=true
priority=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
