# Le port ("__PORT__") est un gabarit : entrypoint.sh le remplace par la
# valeur réelle de $PORT au démarrage du conteneur, avant de lancer Apache.
<VirtualHost *:__PORT__>
    DocumentRoot /var/www/html/public

    <Directory /var/www/html/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
