# Le port ("__PORT__") est un gabarit : entrypoint.sh le remplace par la
# valeur réelle de $PORT au démarrage du conteneur, avant de lancer Apache.
<VirtualHost *:__PORT__>
    DocumentRoot /var/www/html/public

    # Le proxy Render devant ce service coupe déjà à ~100s (fixe, non
    # configurable côté plateforme) : ce Timeout ne sert qu'à ne jamais être
    # la limite la *plus courte* de la chaîne si Apache tournait un jour
    # derrière un autre proxy plus permissif. Une route qui dépasse 100s doit
    # être corrigée (requête trop large, pagination) plutôt que couverte ici.
    Timeout 300

    <Directory /var/www/html/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
