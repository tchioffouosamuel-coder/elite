; Réglages de production. Ajustables sans reconstruire l'image en les
; redéfinissant comme variables d'environnement PHP_INI_* n'est pas supporté
; nativement ici — pour changer une valeur, éditer ce fichier et redéployer.

; Aligné sur `config/app.php` ('timezone' => 'UTC') : évite l'avertissement
; PHP "date.timezone not set" et garde date()/Carbon cohérents.
date.timezone = UTC

; Photos d'élèves, justificatifs de dépenses, imports Excel : le défaut de 2M
; est trop juste.
upload_max_filesize = 20M
post_max_size = 25M

; Génération de PDF (bulletins, statistiques) et exports Excel volumineux :
; le défaut de 128M peut être insuffisant, 30s peut être trop court.
memory_limit = 256M
max_execution_time = 60

; Ne jamais exposer la version de PHP ni afficher les erreurs au client :
; APP_DEBUG=false gère déjà le rendu applicatif, ceci couvre les erreurs
; survenant avant que Laravel ne prenne la main.
expose_php = Off
display_errors = Off
log_errors = On

; Opcache : activé au build (docker-php-ext-enable opcache) ; ces réglages
; évitent de revalider les fichiers à chaque requête, l'image étant
; reconstruite à chaque déploiement de toute façon.
opcache.enable = 1
opcache.validate_timestamps = 0
opcache.max_accelerated_files = 20000
opcache.memory_consumption = 128
