name: Build Elites School Desktop

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

# Nécessaire pour que le jeton d'exécution du workflow (GITHUB_TOKEN) puisse
# créer/publier une Release via `gh release create`/`upload` (étape "Publish
# the GitHub release" ci-dessous).
permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      # `composer install --no-dev` (lancé par scripts/build-installer.cjs
      # pour la copie de l'API embarquée) tourne avec le PHP système du
      # runner, pas le PHP portable téléchargé plus bas pour l'app elle-même —
      # celui préinstallé par défaut sur windows-latest n'active ni fileinfo
      # ni gd, requis par phpspreadsheet/phpword/mpdf/flysystem.
      # 8.4, pas 8.3 (la contrainte `^8.3` de composer.json) : composer.lock a
      # été résolu avec un PHP 8.4 en développement, et certains paquets
      # verrouillés (symfony/*) exigent réellement >=8.4.1 — un 8.3 sur le
      # runner échouerait la résolution des mêmes verrous.
      - name: Setup PHP (for composer)
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: fileinfo, gd, mbstring, intl, pdo_sqlite, sqlite3, zip, curl, sodium, openssl
          tools: composer

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Install desktop dependencies
        working-directory: web/desktop
        # `npm ci`, pas `npm install` : ce dernier peut faire flotter une
        # dépendance transitive au-delà de ce que verrouille package-lock.json
        # (ex. le validateur de schéma d'electron-builder), cassant la
        # validation de `build.publish` d'une exécution à l'autre sans qu'aucun
        # fichier du dépôt n'ait changé — vécu lors du build de la v1.2.0.
        run: npm ci --no-audit --no-fund

      # `scripts/bundle-php.cjs` copie une installation PHP portable
      # existante (poste de développement : `C:\php`) — un runner GitHub
      # Actions n'en a aucune à cet emplacement, donc on en télécharge une
      # (build officiel Windows, NTS/x64, même variante que celle utilisée en
      # développement) et on la pointe via `ELITES_PHP_SOURCE`.
      - name: Download portable PHP
        shell: pwsh
        run: |
          $releases = Invoke-RestMethod -Uri "https://windows.php.net/downloads/releases/releases.json"
          $release = $releases.'8.4'
          # Le nom de la variante (vs16/vs17/...) suit la version de Visual
          # Studio utilisée pour compiler cette version de PHP — imprévisible
          # d'une version à l'autre, on la retrouve donc par motif plutôt que
          # de la coder en dur.
          $variante = $release.PSObject.Properties.Name | Where-Object { $_ -like 'nts-*-x64' } | Select-Object -First 1
          $zipName = $release.$variante.zip.path
          Invoke-WebRequest -Uri "https://windows.php.net/downloads/releases/$zipName" -OutFile php.zip
          Expand-Archive -Path php.zip -DestinationPath C:\php-portable

      - name: Build Windows installer
        working-directory: web/desktop
        env:
          ELITES_PHP_SOURCE: C:\php-portable
        run: npm run ${{ startsWith(github.ref, 'refs/tags/v') && 'release' || 'build' }}

      # electron-builder ne publie plus lui-même la Release GitHub : ses
      # uploads d'assets (exe, blockmap) tournaient en parallèle, chacun
      # tentant d'assurer que la release existe déjà — ce qui a fini par
      # créer deux releases distinctes pour un même tag (v1.1.0, v1.2.3,
      # v1.2.4 en gardent chacune une orpheline), et pour la v1.2.5 carrément
      # deux releases "untagged-" incomplètes, aucune des deux n'ayant reçu
      # tous les fichiers. `gh release create` ci-dessous est un unique appel
      # atomique : plus de course entre plusieurs publications concurrentes.
      #
      # `latest.yml` est ce qu'electron-updater lit pour savoir si une mise à
      # jour existe (cf. `configurerAutoUpdate()` dans `src/main.cjs`) — comme
      # `--prepackaged` fait sortir `doPack()` avant qu'electron-builder ne
      # génère ce fichier lui-même (même raison que pour `app-update.yml`,
      # cf. le commentaire d'`ecrireAppUpdateYml()`), on le construit à la main
      # à partir du setup produit.
      - name: Publish the GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ github.ref_name }}"
          $version = $tag -replace '^v', ''
          $exe = Get-Item "web/desktop/dist/*.exe" | Select-Object -First 1
          $blockmap = Get-Item "web/desktop/dist/*.exe.blockmap" -ErrorAction SilentlyContinue | Select-Object -First 1

          # Get-FileHash rend un hex : on le reconvertit en octets puis en base64,
          # le format attendu par electron-updater dans latest.yml.
          $hash = Get-FileHash -Path $exe.FullName -Algorithm SHA512
          $bytes = [byte[]]::new([int]($hash.Hash.Length / 2))
          for ($i = 0; $i -lt $bytes.Length; $i++) {
            $bytes[$i] = [Convert]::ToByte($hash.Hash.Substring($i * 2, 2), 16)
          }
          $sha512 = [Convert]::ToBase64String($bytes)
          $size = (Get-Item $exe.FullName).Length
          $releaseDate = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ss.fffZ")

          $latestYml = @"
          version: $version
          files:
            - url: $($exe.Name)
              sha512: $sha512
              size: $size
          path: $($exe.Name)
          sha512: $sha512
          releaseDate: '$releaseDate'
          "@
          Set-Content -Path "web/desktop/dist/latest.yml" -Value $latestYml -NoNewline

          $assets = @($exe.FullName, "web/desktop/dist/latest.yml")
          if ($blockmap) { $assets += $blockmap.FullName }

          if (gh release view $tag 2>$null) {
            gh release upload $tag @assets --clobber
          } else {
            gh release create $tag @assets --title $version --notes "Elites School Desktop $version"
          }

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: elites-school-windows
          path: web/desktop/dist/*.exe
          if-no-files-found: error
