name: Build Elites School Desktop

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

# Nécessaire pour que le jeton d'exécution du workflow (GITHUB_TOKEN) puisse
# créer/publier une Release — sans quoi electron-builder échoue avec une
# erreur d'autorisation lors de l'étape `--publish always`.
permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      # `composer install --no-dev` (lancé par scripts/build-installer.cjs
      # pour la copie de l'API embarquée) tourne avec le PHP système du
      # runner, pas le PHP portable téléchargé plus bas pour l'app elle-même —
      # celui préinstallé par défaut sur windows-latest n'active ni fileinfo
      # ni gd, requis par phpspreadsheet/phpword/mpdf/flysystem.
      # 8.4, pas 8.3 (la contrainte `^8.3` de composer.json) : composer.lock a
      # été résolu avec un PHP 8.4 en développement, et certains paquets
      # verrouillés (symfony/*) exigent réellement >=8.4.1 — un 8.3 sur le
      # runner échouerait la résolution des mêmes verrous.
      - name: Setup PHP (for composer)
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: fileinfo, gd, mbstring, intl, pdo_sqlite, sqlite3, zip, curl, sodium, openssl
          tools: composer

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Install desktop dependencies
        working-directory: web/desktop
        run: npm install --no-audit --no-fund

      # `scripts/bundle-php.cjs` copie une installation PHP portable
      # existante (poste de développement : `C:\php`) — un runner GitHub
      # Actions n'en a aucune à cet emplacement, donc on en télécharge une
      # (build officiel Windows, NTS/x64, même variante que celle utilisée en
      # développement) et on la pointe via `ELITES_PHP_SOURCE`.
      - name: Download portable PHP
        shell: pwsh
        run: |
          $releases = Invoke-RestMethod -Uri "https://windows.php.net/downloads/releases/releases.json"
          $release = $releases.'8.4'
          # Le nom de la variante (vs16/vs17/...) suit la version de Visual
          # Studio utilisée pour compiler cette version de PHP — imprévisible
          # d'une version à l'autre, on la retrouve donc par motif plutôt que
          # de la coder en dur.
          $variante = $release.PSObject.Properties.Name | Where-Object { $_ -like 'nts-*-x64' } | Select-Object -First 1
          $zipName = $release.$variante.zip.path
          Invoke-WebRequest -Uri "https://windows.php.net/downloads/releases/$zipName" -OutFile php.zip
          Expand-Archive -Path php.zip -DestinationPath C:\php-portable

      - name: Build and publish Windows installer
        working-directory: web/desktop
        # `GH_TOKEN` est lu par scripts/build-installer.cjs (et transmis tel
        # quel à electron-builder) pour publier la Release GitHub que
        # electron-updater ira ensuite consulter sur les postes desktop —
        # seul un tag `v*` (jamais un `workflow_dispatch` manuel qui n'en
        # porte pas forcément un cohérent) déclenche réellement la publication.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ELITES_PHP_SOURCE: C:\php-portable
        run: npm run ${{ startsWith(github.ref, 'refs/tags/v') && 'release' || 'build' }}

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: elites-school-windows
          path: web/desktop/dist/*.exe
          if-no-files-found: error
