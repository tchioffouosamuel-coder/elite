name: elites_mobile
description: "Application mobile de la Fondation ELITES — hors-ligne d'abord."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Navigation — routes nommées, indispensables pour ouvrir le bon écran
  # depuis une notification push.
  go_router: ^14.6.2

  # État. Les providers exposent directement les Streams Drift : c'est ce qui
  # rend l'UI réactive à la base locale sans code de rafraîchissement manuel.
  flutter_riverpod: ^2.6.1

  # Réseau
  dio: ^5.7.0

  # Base locale — source de vérité de l'interface (cf. conception).
  drift: ^2.22.1
  sqlite3_flutter_libs: ^0.5.26
  path_provider: ^2.1.5
  path: ^1.9.0

  # Secrets : le jeton Sanctum va au Keychain / Keystore, jamais en clair.
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.3

  # Détection du réseau, pour déclencher le drain de l'outbox.
  connectivity_plus: ^6.1.0

  # Identifiants d'opérations de l'outbox, qui servent de clés d'idempotence.
  uuid: ^4.5.1

  # i18n FR/EN, comme le web.
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2

  # Scan du QR affiché au mur de la salle. La résolution du code se fait en
  # local (table `classes.qr_token`), donc sans réseau.
  mobile_scanner: ^7.4.0

  # Filet de sécurité : draine l'outbox même si l'app a été tuée avec des
  # écritures en attente.
  workmanager: ^0.10.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  drift_dev: ^2.22.1
  build_runner: ^2.4.13

flutter:
  uses-material-design: true
